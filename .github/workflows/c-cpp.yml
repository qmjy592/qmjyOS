name: qmjyOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel outdated runs for the same branch or pull request.
concurrency:
  group: qmjyOS-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read repository contents.
permissions:
  contents: read

jobs:
  code-and-config:
    name: Code and QBuild validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tracked shell and Python scripts
        run: |
          bash tools/ci/check_sources.sh

      - name: Validate QBuild configuration
        run: |
          sh tools/qbuild/qbuild config \
            --arch x86_64 \
            --boot bios \
            --jobs 4

      - name: Verify unsupported targets are rejected
        shell: bash
        run: |
          check_rejected_target() {
            local arch="$1"
            local boot="$2"
            local output
            local status

            if output="$(sh tools/qbuild/qbuild config \
                --arch "$arch" --boot "$boot" --jobs 1 2>&1)"; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -ne 3 ]; then
              echo "[FAIL] $arch + $boot returned $status, expected 3"
              printf '%s\\n' "$output"
              exit 1
            fi

            printf '%s\\n' "$output" |
              grep -Fq "目标尚未实现" || {
                echo "[FAIL] Missing unsupported-target diagnostic"
                printf '%s\\n' "$output"
                exit 1
              }

            echo "[PASS] $arch + $boot correctly rejected"
          }

          check_rejected_target x86_64 uefi
          check_rejected_target aarch64 bios

      - name: Inspect QBuild modules and dependencies
        run: |
          sh tools/qbuild/qbuild modules \
            --arch x86_64 \
            --boot bios
          sh tools/qbuild/qbuild deps \
            --arch x86_64 \
            --boot bios

      - name: Validate QBuild dependency plan
        run: |
          sh tools/qbuild/qbuild plan \
            --arch x86_64 \
            --boot bios \
            --jobs 4

  build-and-test:
    name: x86_64 BIOS build and QEMU boot test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - code-and-config

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            make \
            python3 \
            qemu-system-x86

      - name: Build complete kernel with QBuild
        run: |
          sh tools/qbuild/qbuild build \
            --arch x86_64 \
            --boot bios \
            --jobs 4

      - name: Verify ELF class, architecture and load segments
        run: |
          bash tools/ci/verify_elf_layout.sh

      - name: Run complete QBuild test suite
        run: |
          sh tools/qbuild/qbuild test \
            --arch x86_64 \
            --boot bios \
            --jobs 4

      - name: Run host tests with AddressSanitizer and UBSan
        run: |
          bash tools/ci/run_host_sanitizers.sh

      - name: Run QFS host and crash-consistency tests
        run: |
          bash tools/qfs/run_crash_tests.sh

      - name: Run actual QEMU BIOS boot test
        run: |
          bash tools/qemu_boot_test.sh

      - name: Upload kernel build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qmjyOS-x86_64-bios-kernel
          if-no-files-found: error
          retention-days: 14
          path: |
            kernel.elf
            kernel64.elf
            kernel64.bin
