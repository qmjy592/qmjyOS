# qmjyOS module configuration
# Format: MODULE_NAME=enabled|disabled|optional

# Boot
QBOOT=enabled
QBOOT_BIOS=enabled
QBOOT_UEFI=optional

# Architectures
ARCH_X86_64=enabled
ARCH_AARCH64=optional

# Kernel
KERNEL_CORE=enabled
KERNEL_SECURITY=enabled
KERNEL_MODULES=optional

# Memory
MM_PHYSICAL=enabled
MM_PAGING=enabled
MM_HEAP=enabled
MM_SLAB=optional
MM_VIRTUAL=optional

# Process and scheduling
PROCESS=optional
THREAD=optional
SCHEDULER=enabled
SCHEDULER_PREEMPTIVE=optional

# IPC and syscall
IPC=optional
SYSCALL=enabled

# Drivers
DRIVER_SERIAL=enabled
DRIVER_PCI=optional
DRIVER_BLOCK=optional
DRIVER_STORAGE=optional
DRIVER_NETWORK=optional
DRIVER_DISPLAY=optional
DRIVER_GRAPHICS=optional
DRIVER_INPUT=optional
DRIVER_USB=optional
DRIVER_AUDIO=optional
DRIVER_BLUETOOTH=optional

# Filesystems
FS_VFS=enabled
FS_RAMFS=enabled
FS_DEVFS=optional
FS_PROCFS=optional
FS_SYSFS=optional
FS_FAT=optional
FS_BTRFS=optional
FS_EXT2=optional

# Storage and network
STORAGE=optional
NETWORK_STACK=optional

# User space
RUNTIME=optional
SYSTEM_SERVICES=optional
QSHELL=optional
DESKTOP=optional
APPLICATIONS=optional

# Package and installation
QPACKAGE=optional
QINSTALL=optional
QRECOVERY=optional

# Development tools
QBUILD=enabled
QDEBUG=optional
QTEST=optional
